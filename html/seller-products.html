<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroConnect - Products</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2 class="logo">🌾 AgroConnect</h2>

        <ul class="sidebar-links">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="seller-products.html" class="active">🛒 Products</a></li>
            <li><a href="#" class="ordersLink">📦 Orders</a></li>
            <li><a href="profile.html">👤 Profile</a></li>
            <li><a href="settings.html">⚙️ Settings</a></li>
        </ul>

        <button id="logout-btn" class="logout-btn">
            Logout
        </button>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

    <div class="back-navigation">
    <button id="back-btn" class="back-btn">
        🡸 Back
    </button>
</div>


        <!-- Page Header -->
<section class="page-header">

    <h2 id="products-page-title">My Products</h2>
    <p id="products-page-description">

    Manage your agricultural products, update listings,
    and add new products for buyers to discover.
    
    </p>
</section>

<!-- Quick Stats -->
<section class="stats-grid">

            <div class="stat-card">
                <h3>Total Products</h3>
                <p id="total-products">0</p>
            </div>

            <div class="stat-card">
                <h3>Available</h3>
                <p id="available-products">0</p>
            </div>

            <div class="stat-card">
                <h3>Out of Stock</h3>
                <p id="outofstock-products">0</p>
            </div>

        </section>

        <!-- Action Buttons -->
        <section class="products-toolbar">

    <button id="add-product-btn" class="btn btn-plum">
        + Add New Product
    </button>

</section>

        <!-- Seller Products -->
<section class="products-section">

    <div id="products-container" class="products-grid">


    </div>

</section>

    </main>

</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/seller-products.js"></script>

<script type="module">

import {
    requireAuth,
    logout,
    setupOrdersLink,
    setupProductsLink
} from "./js/auth.js";

if (!requireAuth()) {

}

requireAuth();

setupOrdersLink();
setupProductsLink();

const logoutBtn = document.getElementById("logout-btn");

if (logoutBtn) {
    logoutBtn.addEventListener("click", logout);
}

</script>

</body>
</html>
